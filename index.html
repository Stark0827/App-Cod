<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Códigos Privado</title>
    
    <!-- Configuración PWA -->
    <link rel="manifest" href="data:application/manifest+json,{
        \"name\": \"Gestor de Códigos\",
        \"short_name\": \"Códigos\",
        \"start_url\": \".\",
        \"display\": \"standalone\",
        \"background_color\": \"#f4f6f9\",
        \"theme_color\": \"#007bff\",
        \"icons\": [{
            \"src\": \"https://cdn-icons-png.flaticon.com/512/0/191.png\",
            \"sizes\": \"512x512\",
            \"type\": \"image/png\"
        }]
    }">
    <meta name="theme-color" content="#007bff">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 480px;
        }
        h2 { margin-top: 0; color: #333; text-align: center; }
        input[type="password"], textarea, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            margin-top: 10px;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 12px;
            transition: background 0.3s;
        }
        .btn-primary { background-color: #007bff; color: white; }
        .btn-primary:hover { background-color: #0056b3; }
        .btn-success { background-color: #28a745; color: white; }
        .btn-success:hover { background-color: #218838; }
        .btn-whatsapp { background-color: #25D366; color: white; }
        .btn-whatsapp:hover { background-color: #1ebc57; }
        .btn-danger { background-color: #dc3545; color: white; }
        .hidden { display: none; }
        .status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            font-size: 14px;
        }
        .status.success { background-color: #d4edda; color: #155724; }
        .status.error { background-color: #f8d7da; color: #721c24; }
        .counter {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #007bff;
            margin: 15px 0;
        }
        hr { border: 0; height: 1px; background: #e0e0e0; margin: 20px 0; }
    </style>
</head>
<body>

<div class="card">
    <h2>Gestor de Códigos</h2>

    <!-- Pantalla de Login -->
    <div id="login-screen">
        <p style="text-align: center; color: #666;">Ingresa tu clave de acceso:</p>
        <input type="password" id="access-key" placeholder="Contraseña">
        <button class="btn-primary" onclick="login()">Ingresar</button>
        <div id="login-status" class="status hidden"></div>
    </div>

    <!-- Módulo Principal (Usuarios y Admin) -->
    <div id="main-screen" class="hidden">
        <div class="counter" id="code-counter">Cargando códigos disponibles...</div>

        <label style="font-weight: bold; color: #444;">Cantidad de códigos a pedir:</label>
        <select id="code-qty">
            <option value="1">1 Código</option>
            <option value="2">2 Códigos</option>
            <option value="3">3 Códigos</option>
            <option value="4">4 Códigos</option>
            <option value="5">5 Códigos</option>
        </select>

        <button class="btn-whatsapp" onclick="requestCodes()">📱 Solicitar por WhatsApp y Telegram</button>
        <div id="user-status" class="status hidden"></div>

        <!-- Panel Exclusivo de Administrador -->
        <div id="admin-panel" class="hidden">
            <hr>
            <h3 style="text-align: center; color: #333;">Panel de Administración</h3>
            <p style="font-size: 13px; color: #666;">Pega los códigos aquí (uno por línea):</p>
            <textarea id="bulk-codes" rows="6" placeholder="CODIGO1&#10;CODIGO2&#10;CODIGO3"></textarea>
            <button class="btn-success" onclick="uploadCodes()">Cargar Códigos a Firebase</button>
            <button class="btn-danger" onclick="clearAllCodes()">Borrar Todos los Códigos</button>
            <div id="admin-status" class="status hidden"></div>
        </div>
    </div>
</div>

<script>
    // Configuración de Seguridad y Canales
    const CLAVE_USUARIO = "1234";
    const CLAVE_ADMIN = "admin123";
    const NUMERO_WHATSAPP = "573015379493"; // Tu número configurado
    
    // Configuración Firebase RTDB
    const FIREBASE_URL = "https://base-de-datos-codigos-c1bb1-default-rtdb.firebaseio.com/codigos";
    
    // Configuración Telegram
    const TELEGRAM_TOKEN = "7891823719:AAH..."; // Tu token del Bot
    const TELEGRAM_CHAT_ID = "123456789";       // Tu Chat ID personal

    let isAwesomeAdmin = false;

    function login() {
        const inputKey = document.getElementById('access-key').value.trim();
        const status = document.getElementById('login-status');

        if (inputKey === CLAVE_ADMIN) {
            isAwesomeAdmin = true;
            document.getElementById('admin-panel').classList.remove('hidden');
            showMainScreen();
        } else if (inputKey === CLAVE_USUARIO) {
            isAwesomeAdmin = false;
            document.getElementById('admin-panel').classList.add('hidden');
            showMainScreen();
        } else {
            showStatus(status, "Clave incorrecta", "error");
        }
    }

    function showMainScreen() {
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('main-screen').classList.remove('hidden');
        fetchCounter();
    }

    async function fetchCounter() {
        try {
            const res = await fetch(`${FIREBASE_URL}.json`);
            const data = await res.json();
            const counterEl = document.getElementById('code-counter');
            
            if (!data) {
                counterEl.textContent = "Códigos disponibles: 0";
                return [];
            }
            
            const availableKeys = Object.keys(data);
            counterEl.textContent = `Códigos disponibles: ${availableKeys.length}`;
            return availableKeys.map(key => ({ id: key, value: data[key] }));
        } catch (err) {
            document.getElementById('code-counter').textContent = "Error al conectar con la base de datos";
            return [];
        }
    }

    async function requestCodes() {
        const qty = parseInt(document.getElementById('code-qty').value);
        const status = document.getElementById('user-status');
        showStatus(status, "Procesando solicitud...", "success");

        const codes = await fetchCounter();

        if (codes.length < qty) {
            showStatus(status, `No hay suficientes códigos. Disponibles: ${codes.length}`, "error");
            return;
        }

        const selected = codes.slice(0, qty);
        let messageText = `📲 *Solicitud de Códigos (${qty})*\n\n`;

        for (let i = 0; i < selected.length; i++) {
            const item = selected[i];
            messageText += `Código ${i + 1}: \`${item.value}\`\n`;
            
            // Eliminar de Firebase
            await fetch(`${FIREBASE_URL}/${item.id}.json`, { method: 'DELETE' });
        }

        // 1. Enviar respaldo automático a Telegram
        try {
            await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: TELEGRAM_CHAT_ID,
                    text: messageText,
                    parse_mode: 'Markdown'
                })
            });
        } catch(e) { console.error("Error Telegram", e); }

        // 2. Abrir WhatsApp con el texto preescribido hacia tu número
        const cleanMsg = encodeURIComponent(messageText.replace(/\*/g, '').replace(/`/g, ''));
        const waUrl = `https://wa.me/${NUMERO_WHATSAPP}?text=${cleanMsg}`;
        window.open(waUrl, '_blank');

        showStatus(status, "¡Códigos extraídos correctamente! Se ha abierto WhatsApp.", "success");
        fetchCounter();
    }

    async function uploadCodes() {
        const text = document.getElementById('bulk-codes').value.trim();
        const status = document.getElementById('admin-status');
        
        if (!text) {
            showStatus(status, "Ingresa al menos un código", "error");
            return;
        }

        const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);

        for (const code of lines) {
            await fetch(`${FIREBASE_URL}.json`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(code)
            });
        }

        document.getElementById('bulk-codes').value = '';
        showStatus(status, `Se cargaron ${lines.length} códigos con éxito`, "success");
        fetchCounter();
    }

    async function clearAllCodes() {
        if (!confirm("¿Seguro que deseas eliminar TODOS los códigos de la base de datos?")) return;
        const status = document.getElementById('admin-status');
        
        await fetch(`${FIREBASE_URL}.json`, { method: 'DELETE' });
        showStatus(status, "Base de datos vaciada", "error");
        fetchCounter();
    }

    function showStatus(element, msg, type) {
        element.textContent = msg;
        element.className = `status ${type}`;
        element.classList.remove('hidden');
    }

    // Service Worker para PWA
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('data:text/javascript,console.log("PWA SW activo")');
    }
</script>
</body>
</html>
