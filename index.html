<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Códigos Privado</title>
    
    <!-- Configuración PWA -->
    <link rel="manifest" href="data:application/manifest+json,{
        &quot;name&quot;: &quot;Gestor de Códigos&quot;,
        &quot;short_name&quot;: &quot;Códigos&quot;,
        &quot;start_url&quot;: &quot;.&quot;,
        &quot;display&quot;: &quot;standalone&quot;,
        &quot;background_color&quot;: &quot;#f4f6f9&quot;,
        &quot;theme_color&quot;: &quot;#007bff&quot;,
        &quot;icons&quot;: [{
            &quot;src&quot;: &quot;https://cdn-icons-png.flaticon.com/512/0/191.png&quot;,
            &quot;sizes&quot;: &quot;512x512&quot;,
            &quot;type&quot;: &quot;image/png&quot;
        }]
    }">
    <meta name="theme-color" content="#007bff">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            padding: 15px;
            margin: 0;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 480px;
        }
        .banner {
            background-color: #fff8e1;
            border: 1px solid #ffe082;
            color: #8d6e63;
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            text-align: center;
            margin-bottom: 15px;
        }
        h2 { margin-top: 0; color: #333; text-align: center; font-size: 20px; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }
        .stat-box {
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
        }
        .box-baja { background-color: #e3f2fd; color: #1565c0; }
        .box-alta { background-color: #f3e5f5; color: #7b1fa2; }
        .box-oriental { background-color: #e8f5e9; color: #2e7d32; }
        
        input[type="password"], textarea, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            margin-top: 10px;
            font-size: 14px;
        }
        
        .cat-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .btn-baja { background-color: #007bff; }
        .btn-alta { background-color: #6f42c1; }
        .btn-oriental { background-color: #28a745; }
        
        .action-box {
            background-color: #f8f9fa;
            border: 2px dashed #007bff;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            text-align: center;
        }
        
        .btn-process {
            background-color: #25D366;
            color: white;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-cancel {
            background-color: #6c757d;
            color: white;
            width: 100%;
            padding: 8px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            margin-top: 6px;
        }
        .btn-admin-add { background-color: #28a745; color: white; width: 100%; padding: 10px; border: none; border-radius: 8px; margin-top: 8px; cursor: pointer; font-weight: bold; }
        .btn-admin-clear { background-color: #dc3545; color: white; width: 100%; padding: 10px; border: none; border-radius: 8px; margin-top: 8px; cursor: pointer; font-weight: bold; }
        
        .hidden { display: none; }
        .status {
            margin-top: 12px;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            font-size: 13px;
        }
        .status.success { background-color: #d4edda; color: #155724; }
        .status.error { background-color: #f8d7da; color: #721c24; }
        hr { border: 0; height: 1px; background: #e0e0e0; margin: 20px 0; }
    </style>
</head>
<body>

<div class="card">
    <div class="banner">
        📱 Para instalar como App: Abre el menú de tu navegador y selecciona "Agregar a la pantalla de inicio".
    </div>

    <h2>Gestor de Códigos ☁️</h2>

    <!-- Login -->
    <div id="login-screen">
        <p style="text-align: center; color: #666; font-size: 14px;">Ingresa tu clave de acceso:</p>
        <input type="password" id="access-key" placeholder="Contraseña">
        <button class="cat-btn btn-baja" onclick="login()">Ingresar</button>
        <div id="login-status" class="status hidden"></div>
    </div>

    <!-- Módulo Principal -->
    <div id="main-screen" class="hidden">
        <!-- Estadísticas -->
        <div class="stats-grid">
            <div class="stat-box box-baja">🌊 Occ. Baja<br><span id="cnt-baja" style="font-size:18px;">0</span></div>
            <div class="stat-box box-alta">⚡ Occ. Alta<br><span id="cnt-alta" style="font-size:18px;">0</span></div>
            <div class="stat-box box-oriental">👷 Oriental<br><span id="cnt-oriental" style="font-size:18px;">0</span></div>
        </div>

        <p style="text-align: center; font-size: 13px; color: #555; margin-bottom: 5px;">Selecciona la categoría a solicitar:</p>

        <!-- Botones de Categorías -->
        <button class="cat-btn btn-baja" onclick="reserveCode('Occ. Baja')">🌊 Pedir Occ. Baja</button>
        <button class="cat-btn btn-alta" onclick="reserveCode('Occ. Alta')">⚡ Pedir Occ. Alta</button>
        <button class="cat-btn btn-oriental" onclick="reserveCode('Oriental')">👷 Pedir Oriental</button>

        <!-- Área de Acción / Reserva -->
        <div id="action-box" class="action-box hidden">
            <div style="font-weight: bold; color: #333; font-size: 14px;">
                🔑 <span id="reserved-info">Código listo para entregar</span>
            </div>
            <button class="btn-process" onclick="processAndSend()">📱 Solicitar por WhatsApp y Telegram</button>
            <button class="btn-cancel" onclick="cancelReservation()">✖ Cancelar</button>
        </div>

        <div id="user-status" class="status hidden"></div>

        <!-- Panel Administrador -->
        <div id="admin-panel" class="hidden">
            <hr>
            <h3 style="text-align: center; color: #333; font-size: 16px; margin: 0 0 10px 0;">Panel de Administración</h3>
            
            <label style="font-size: 12px; color: #666;">Selecciona la categoría para cargar:</label>
            <select id="admin-category">
                <option value="Occ. Baja">Occ. Baja</option>
                <option value="Occ. Alta">Occ. Alta</option>
                <option value="Oriental">Oriental</option>
            </select>

            <textarea id="bulk-codes" rows="4" placeholder="Pega los códigos aquí (uno por línea)..."></textarea>
            <button class="btn-admin-add" onclick="uploadCodes()">Cargar Códigos a Firebase</button>
            <button class="btn-admin-clear" onclick="clearCategoryCodes()">Borrar Códigos de esta Categoría</button>
            <div id="admin-status" class="status hidden"></div>
        </div>
    </div>
</div>

<script>
    // === CONFIGURACIÓN DE ACCESO Y CONTACTO ===
    const CLAVE_USUARIO = "1234";
    const CLAVE_ADMIN = "admin123";
    const NUMERO_WHATSAPP = "573015379493";
    
    // Base de Datos Firebase Realtime
    const FIREBASE_BASE_URL = "https://base-de-datos-codigos-c1bb1-default-rtdb.firebaseio.com/codigos";
    
    // Telegram Bot
    const TELEGRAM_TOKEN = "8759498141:AAHXZVSk7yX6iHsLJodEuh66bLdKO0Us7v8"; // 
    const TELEGRAM_CHAT_ID = "6449886096";       // 

    let reservedItem = null;
    let currentCategory = "";

    // Función para enviar notificaciones formateadas a Telegram
    async function sendTelegramNotification(text) {
        if (!TELEGRAM_TOKEN || TELEGRAM_TOKEN.includes("AAH...")) return;
        try {
            await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: TELEGRAM_CHAT_ID,
                    text: text,
                    parse_mode: 'Markdown'
                })
            });
        } catch(e) { 
            console.error("Error al notificar a Telegram", e); 
        }
    }

    async function login() {
        const inputKey = document.getElementById('access-key').value.trim();
        const status = document.getElementById('login-status');
        const now = new Date().toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' });

        if (inputKey === CLAVE_ADMIN) {
            document.getElementById('admin-panel').classList.remove('hidden');
            showMainScreen();
            await sendTelegramNotification(`👑 *ALERTA DE ACCESO*\n\nAcceso como *Administrador*\nHora: ${now}`);
        } else if (inputKey === CLAVE_USUARIO) {
            document.getElementById('admin-panel').classList.add('hidden');
            showMainScreen();
            await sendTelegramNotification(`🔓 *ALERTA DE ACCESO*\n\nUn usuario ha ingresado a la app.\nHora: ${now}`);
        } else {
            showStatus(status, "Clave incorrecta", "error");
        }
    }

    function showMainScreen() {
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('main-screen').classList.remove('hidden');
        fetchAllCounters();
    }

    function getCatKey(cat) {
        if (cat === "Occ. Baja") return "occ_baja";
        if (cat === "Occ. Alta") return "occ_alta";
        if (cat === "Oriental") return "oriental";
        return "general";
    }

    async function fetchAllCounters() {
        await fetchCategoryData("Occ. Baja", "cnt-baja");
        await fetchCategoryData("Occ. Alta", "cnt-alta");
        await fetchCategoryData("Oriental", "cnt-oriental");
    }

    async function fetchCategoryData(cat, elementId) {
        try {
            const catKey = getCatKey(cat);
            // Intenta leer la subcarpeta de la categoría
            let res = await fetch(`${FIREBASE_BASE_URL}/${catKey}.json`);
            let data = await res.json();
            
            // Si la subcarpeta no existe, busca en la raíz
            if (!data) {
                const rootRes = await fetch(`${FIREBASE_BASE_URL}.json`);
                const rootData = await rootRes.json();
                if (rootData && typeof rootData === 'object') {
                    const keys = Object.keys(rootData).filter(k => k !== 'occ_baja' && k !== 'occ_alta' && k !== 'oriental');
                    if (cat === "Occ. Baja" && keys.length > 0) {
                        data = {};
                        keys.forEach(k => data[k] = rootData[k]);
                    }
                }
            }

            const count = data ? Object.keys(data).length : 0;
            if (elementId && document.getElementById(elementId)) {
                document.getElementById(elementId).textContent = count;
            }
            
            return data ? Object.keys(data).map(k => ({ id: k, value: data[k] })) : [];
        } catch (e) {
            if (elementId && document.getElementById(elementId)) {
                document.getElementById(elementId).textContent = "0";
            }
            return [];
        }
    }

    async function reserveCode(category) {
        const status = document.getElementById('user-status');
        showStatus(status, "Obteniendo código disponible...", "success");

        const codes = await fetchCategoryData(category, getElementByCat(category));

        if (codes.length === 0) {
            showStatus(status, `No hay códigos disponibles en ${category}.`, "error");
            return;
        }

        currentCategory = category;
        reservedItem = codes[0]; // Toma el primer código disponible

        document.getElementById('reserved-info').textContent = `1 Código disponible para [${category}]`;
        document.getElementById('action-box').classList.remove('hidden');
        showStatus(status, `Código reservado. Presiona el botón verde para enviar.`, "success");
    }

    function getElementByCat(cat) {
        if (cat === "Occ. Baja") return "cnt-baja";
        if (cat === "Occ. Alta") return "cnt-alta";
        return "cnt-oriental";
    }

    function cancelReservation() {
        reservedItem = null;
        currentCategory = "";
        document.getElementById('action-box').classList.add('hidden');
        const status = document.getElementById('user-status');
        showStatus(status, "Reserva cancelada", "error");
    }

    async function processAndSend() {
        if (!reservedItem) return;

        const status = document.getElementById('user-status');
        showStatus(status, "Procesando código...", "success");

        const catKey = getCatKey(currentCategory);
        const codeValue = reservedItem.value;
        const codeId = reservedItem.id;

        // Borra el código de Firebase
        let deleteRes = await fetch(`${FIREBASE_BASE_URL}/${catKey}/${codeId}.json`, { method: 'DELETE' });
        if (!deleteRes.ok) {
            await fetch(`${FIREBASE_BASE_URL}/${codeId}.json`, { method: 'DELETE' });
        }

        // Mensaje formateado para Telegram
        const telegramMsg = `📲 *SOLICITUD DE CÓDIGO*\n\n` +
                            `📌 *Categoría:* ${currentCategory}\n` +
                            `🔑 *Código:* \`${codeValue}\`\n\n` +
                            `⚡ *Estado:* Entregado y eliminado de la base de datos.`;

        // 1. Enviar aviso a Telegram
        await sendTelegramNotification(telegramMsg);

        // 2. Formato para WhatsApp
        const waMsgText = `Hola, solicito el código para *${currentCategory}*:\n\n*Código:* ${codeValue}`;
        const waUrl = `https://wa.me/${NUMERO_WHATSAPP}?text=${encodeURIComponent(waMsgText)}`;
        
        // Abre WhatsApp
        window.open(waUrl, '_blank');

        showStatus(status, "¡Código procesado y enviado con éxito!", "success");
        document.getElementById('action-box').classList.add('hidden');
        reservedItem = null;
        fetchAllCounters();
    }

    async function uploadCodes() {
        const cat = document.getElementById('admin-category').value;
        const text = document.getElementById('bulk-codes').value.trim();
        const status = document.getElementById('admin-status');

        if (!text) {
            showStatus(status, "Ingresa al menos un código", "error");
            return;
        }

        const catKey = getCatKey(cat);
        const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);

        for (const code of lines) {
            await fetch(`${FIREBASE_BASE_URL}/${catKey}.json`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(code)
            });
        }

        document.getElementById('bulk-codes').value = '';
        showStatus(status, `Se cargaron ${lines.length} código(s) en ${cat}`, "success");
        fetchAllCounters();
    }

    async function clearCategoryCodes() {
        const cat = document.getElementById('admin-category').value;
        if (!confirm(`¿Seguro que deseas eliminar TODOS los códigos de ${cat}?`)) return;

        const catKey = getCatKey(cat);
        const status = document.getElementById('admin-status');

        await fetch(`${FIREBASE_BASE_URL}/${catKey}.json`, { method: 'DELETE' });
        showStatus(status, `Se borraron los códigos de ${cat}`, "error");
        fetchAllCounters();
    }

    function showStatus(element, msg, type) {
        element.textContent = msg;
        element.className = `status ${type}`;
        element.classList.remove('hidden');
    }

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('data:text/javascript,console.log("PWA SW activo")');
    }
</script>
</body>
</html>
