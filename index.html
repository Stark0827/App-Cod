<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Códigos Privado</title>
    
    <!-- Configuración PWA -->
    <link rel="manifest" href="data:application/manifest+json,{
        &quot;name&quot;: &quot;Gestor de Códigos&quot;,
        &quot;short_name&quot;: &quot;Códigos&quot;,
        &quot;start_url&quot;: &quot;.&quot;,
        &quot;display&quot;: &quot;standalone&quot;,
        &quot;background_color&quot;: &quot;#f4f6f9&quot;,
        &quot;theme_color&quot;: &quot;#007bff&quot;,
        &quot;icons&quot;: [{
            &quot;src&quot;: &quot;https://cdn-icons-png.flaticon.com/512/0/191.png&quot;,
            &quot;sizes&quot;: &quot;512x512&quot;,
            &quot;type&quot;: &quot;image/png&quot;
        }]
    }">
    <meta name="theme-color" content="#007bff">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            padding: 15px;
            margin: 0;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 480px;
        }
        .banner {
            background-color: #fff8e1;
            border: 1px solid #ffe082;
            color: #8d6e63;
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            text-align: center;
            margin-bottom: 15px;
        }
        h2 { margin-top: 0; color: #333; text-align: center; font-size: 20px; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }
        .stat-box {
            padding: 8px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            text-align: center;
        }
        .box-baja { background-color: #e3f2fd; color: #1565c0; }
        .box-alta { background-color: #f3e5f5; color: #7b1fa2; }
        .box-oriental { background-color: #e8f5e9; color: #2e7d32; }
        
        input[type="password"], textarea, input[type="number"], select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            margin-top: 10px;
            font-size: 14px;
        }
        
        .cat-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            margin-top: 8px;
        }
        .btn-baja { background-color: #007bff; }
        .btn-alta { background-color: #6f42c1; }
        .btn-oriental { background-color: #28a745; }
        
        .action-box {
            background-color: #f8f9fa;
            border: 2px dashed #007bff;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            text-align: center;
        }
        
        .btn-process {
            background-color: #17a2b8;
            color: white;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-cancel {
            background-color: #6c757d;
            color: white;
            width: 100%;
            padding: 8px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            margin-top: 6px;
        }
        .btn-admin-add { background-color: #28a745; color: white; width: 100%; padding: 10px; border: none; border-radius: 8px; margin-top: 8px; cursor: pointer; }
        .btn-admin-clear { background-color: #dc3545; color: white; width: 100%; padding: 10px; border: none; border-radius: 8px; margin-top: 8px; cursor: pointer; }
        
        .hidden { display: none; }
        .status {
            margin-top: 12px;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            font-size: 13px;
        }
        .status.success { background-color: #d4edda; color: #155724; }
        .status.error { background-color: #f8d7da; color: #721c24; }
        hr { border: 0; height: 1px; background: #e0e0e0; margin: 20px 0; }
    </style>
</head>
<body>

<div class="card">
    <div class="banner">
        📱 Para instalar como App en tu celular: Toca los 3 puntos u opciones de tu navegador y elige "Agregar a la pantalla de inicio".
    </div>

    <h2>Gestor de Códigos ☁️</h2>

    <!-- Login -->
    <div id="login-screen">
        <p style="text-align: center; color: #666; font-size: 14px;">Ingresa tu clave de acceso:</p>
        <input type="password" id="access-key" placeholder="Contraseña">
        <button class="cat-btn btn-baja" onclick="login()" style="margin-top: 12px;">Ingresar</button>
        <div id="login-status" class="status hidden"></div>
    </div>

    <!-- Módulo Principal -->
    <div id="main-screen" class="hidden">
        <!-- Estadísticas -->
        <div class="stats-grid">
            <div class="stat-box box-baja">🌊 Occ. Baja: <span id="cnt-baja">0</span></div>
            <div class="stat-box box-alta">⚡ Occ. Alta: <span id="cnt-alta">0</span></div>
            <div class="stat-box box-oriental">👷 Oriental: <span id="cnt-oriental">0</span></div>
        </div>

        <label style="font-size: 13px; font-weight: bold; color: #444;">🔢 Cantidad de códigos a solicitar:</label>
        <input type="number" id="code-qty" value="1" min="1" max="10">

        <!-- Botones de Categorías -->
        <button class="cat-btn btn-baja" onclick="reserveCodes('Occ. Baja')">🌊 Occ. Baja</button>
        <button class="cat-btn btn-alta" onclick="reserveCodes('Occ. Alta')">⚡ Occ. Alta</button>
        <button class="cat-btn btn-oriental" onclick="reserveCodes('Oriental')">👷 Oriental</button>

        <!-- Área de Acción / Reserva -->
        <div id="action-box" class="action-box hidden">
            <div style="font-weight: bold; color: #333; font-size: 14px;">
                🔑 <span id="reserved-info">0 código(s) reservado(s)</span>
            </div>
            <button class="btn-process" onclick="processAndSend()">📱 Procesar y Enviar a WhatsApp y Telegram</button>
            <button class="btn-cancel" onclick="cancelReservation()">✖ Cancelar Reserva</button>
        </div>

        <div id="user-status" class="status hidden"></div>

        <!-- Panel Administrador -->
        <div id="admin-panel" class="hidden">
            <hr>
            <h3 style="text-align: center; color: #333; font-size: 16px; margin: 0 0 10px 0;">Panel de Administración</h3>
            
            <label style="font-size: 12px; color: #666;">Selecciona la categoría para cargar:</label>
            <select id="admin-category">
                <option value="Occ. Baja">Occ. Baja</option>
                <option value="Occ. Alta">Occ. Alta</option>
                <option value="Oriental">Oriental</option>
            </select>

            <textarea id="bulk-codes" rows="5" placeholder="Pega los códigos aquí (uno por línea)..." style="margin-top:10px;"></textarea>
            <button class="btn-admin-add" onclick="uploadCodes()">Cargar Códigos a Firebase</button>
            <button class="btn-admin-clear" onclick="clearCategoryCodes()">Borrar Códigos de esta Categoría</button>
            <div id="admin-status" class="status hidden"></div>
        </div>
    </div>
</div>

<script>
    // === CONFIGURACIÓN ===
    const CLAVE_USUARIO = "1234";
    const CLAVE_ADMIN = "admin123";
    const NUMERO_WHATSAPP = "573015379493";
    
    // Firebase URL base
    const FIREBASE_BASE_URL = "https://base-de-datos-codigos-c1bb1-default-rtdb.firebaseio.com/codigos";
    
    // Telegram Bot (Asegúrate de colocar tu Token y Chat ID correctos)
    const TELEGRAM_TOKEN = "8759498141:AAHXZVSk7yX6iHsLJodEuh66bLdKO0Us7v8"; // Tu token
    const TELEGRAM_CHAT_ID = "6449886096";       // Tu Chat ID

    let reservedItems = [];
    let currentCategory = "";

    async function sendTelegramAlert(text) {
        if (!TELEGRAM_TOKEN || TELEGRAM_TOKEN.includes("AAH...")) return;
        try {
            await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: TELEGRAM_CHAT_ID,
                    text: text,
                    parse_mode: 'Markdown'
                })
            });
        } catch(e) { console.error("Error al enviar alerta a Telegram", e); }
    }

    async function login() {
        const inputKey = document.getElementById('access-key').value.trim();
        const status = document.getElementById('login-status');

        if (inputKey === CLAVE_ADMIN) {
            document.getElementById('admin-panel').classList.remove('hidden');
            await sendTelegramAlert("👑 *Aviso:* Se ha iniciado sesión como *Administrador* en la app.");
            showMainScreen();
        } else if (inputKey === CLAVE_USUARIO) {
            document.getElementById('admin-panel').classList.add('hidden');
            await sendTelegramAlert("🔓 *Aviso:* Un usuario ha iniciado sesión en la app de códigos.");
            showMainScreen();
        } else {
            showStatus(status, "Clave incorrecta", "error");
        }
    }

    function showMainScreen() {
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('main-screen').classList.remove('hidden');
        fetchAllCounters();
    }

    function getCatKey(cat) {
        if (cat === "Occ. Baja") return "occ_baja";
        if (cat === "Occ. Alta") return "occ_alta";
        if (cat === "Oriental") return "oriental";
        return "general";
    }

    async function fetchAllCounters() {
        await fetchCategoryCount("Occ. Baja", "cnt-baja");
        await fetchCategoryCount("Occ. Alta", "cnt-alta");
        await fetchCategoryCount("Oriental", "cnt-oriental");
    }

    async function fetchCategoryCount(cat, elementId) {
        try {
            const catKey = getCatKey(cat);
            // Intenta leer por categoría específica
            let res = await fetch(`${FIREBASE_BASE_URL}/${catKey}.json`);
            let data = await res.json();
            
            // Si la categoría específica está vacía, revisa si hay una lista general en la raíz de /codigos
            if (!data) {
                const rootRes = await fetch(`${FIREBASE_BASE_URL}.json`);
                const rootData = await rootRes.json();
                if (rootData && typeof rootData === 'object') {
                    // Filtrar claves que no correspondan a carpetas creadas
                    const keys = Object.keys(rootData).filter(k => k !== 'occ_baja' && k !== 'occ_alta' && k !== 'oriental');
                    if (cat === "Occ. Baja" && keys.length > 0) {
                        data = {};
                        keys.forEach(k => data[k] = rootData[k]);
                    }
                }
            }

            const count = data ? Object.keys(data).length : 0;
            if (elementId && document.getElementById(elementId)) {
                document.getElementById(elementId).textContent = count;
            }
            return data ? Object.keys(data).map(k => ({ id: k, value: data[k] })) : [];
        } catch (e) {
            if (elementId && document.getElementById(elementId)) {
                document.getElementById(elementId).textContent = "0";
            }
            return [];
        }
    }

    async function reserveCodes(category) {
        const qty = parseInt(document.getElementById('code-qty').value) || 1;
        const status = document.getElementById('user-status');
        showStatus(status, "Buscando códigos disponibles...", "success");

        const codes = await fetchCategoryCount(category, getElementByCat(category));

        if (codes.length < qty) {
            showStatus(status, `No hay suficientes códigos en ${category}. Disponibles: ${codes.length}`, "error");
            return;
        }

        currentCategory = category;
        reservedItems = codes.slice(0, qty);

        document.getElementById('reserved-info').textContent = `${qty} código(s) reservado(s) [${category}]`;
        document.getElementById('action-box').classList.remove('hidden');
        showStatus(status, `Se reservaron ${qty} código(s). Toca el botón para enviar.`, "success");
    }

    function getElementByCat(cat) {
        if (cat === "Occ. Baja") return "cnt-baja";
        if (cat === "Occ. Alta") return "cnt-alta";
        return "cnt-oriental";
    }

    function cancelReservation() {
        reservedItems = [];
        currentCategory = "";
        document.getElementById('action-box').classList.add('hidden');
        const status = document.getElementById('user-status');
        showStatus(status, "Reserva cancelada", "error");
    }

    async function processAndSend() {
        if (reservedItems.length === 0) return;

        const status = document.getElementById('user-status');
        showStatus(status, "Procesando y eliminando de la base de datos...", "success");

        const catKey = getCatKey(currentCategory);
        let messageText = `📲 *Solicitud de Códigos (${currentCategory})*\n\n`;

        for (let i = 0; i < reservedItems.length; i++) {
            const item = reservedItems[i];
            messageText += `Código ${i + 1}: \`${item.value}\`\n`;

            // Elimina el código de la categoría o de la raíz según corresponda
            let deleteRes = await fetch(`${FIREBASE_BASE_URL}/${catKey}/${item.id}.json`, { method: 'DELETE' });
            if (!deleteRes.ok) {
                await fetch(`${FIREBASE_BASE_URL}/${item.id}.json`, { method: 'DELETE' });
            }
        }

        // 1. Enviar detalle del código por Telegram
        await sendTelegramAlert(messageText);

        // 2. Abrir WhatsApp
        const cleanMsg = encodeURIComponent(messageText.replace(/\*/g, '').replace(/`/g, ''));
        const waUrl = `https://wa.me/${NUMERO_WHATSAPP}?text=${cleanMsg}`;
        window.open(waUrl, '_blank');

        showStatus(status, "¡Códigos enviados con éxito!", "success");
        document.getElementById('action-box').classList.add('hidden');
        reservedItems = [];
        fetchAllCounters();
    }

    async function uploadCodes() {
        const cat = document.getElementById('admin-category').value;
        const text = document.getElementById('bulk-codes').value.trim();
        const status = document.getElementById('admin-status');

        if (!text) {
            showStatus(status, "Ingresa al menos un código", "error");
            return;
        }

        const catKey = getCatKey(cat);
        const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);

        for (const code of lines) {
            await fetch(`${FIREBASE_BASE_URL}/${catKey}.json`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(code)
            });
        }

        document.getElementById('bulk-codes').value = '';
        showStatus(status, `Se cargaron ${lines.length} código(s) en ${cat}`, "success");
        fetchAllCounters();
    }

    async function clearCategoryCodes() {
        const cat = document.getElementById('admin-category').value;
        if (!confirm(`¿Seguro que deseas eliminar TODOS los códigos de ${cat}?`)) return;

        const catKey = getCatKey(cat);
        const status = document.getElementById('admin-status');

        await fetch(`${FIREBASE_BASE_URL}/${catKey}.json`, { method: 'DELETE' });
        showStatus(status, `Se borraron los códigos de ${cat}`, "error");
        fetchAllCounters();
    }

    function showStatus(element, msg, type) {
        element.textContent = msg;
        element.className = `status ${type}`;
        element.classList.remove('hidden');
    }

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('data:text/javascript,console.log("PWA SW activo")');
    }
</script>
</body>
</html>
