<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Códigos Privado</title>
    
    <!-- Configuración PWA -->
    <link rel="manifest" href="data:application/manifest+json,{
        &quot;name&quot;: &quot;Gestor de Códigos&quot;,
        &quot;short_name&quot;: &quot;Códigos&quot;,
        &quot;start_url&quot;: &quot;.&quot;,
        &quot;display&quot;: &quot;standalone&quot;,
        &quot;background_color&quot;: &quot;#f4f6f9&quot;,
        &quot;theme_color&quot;: &quot;#007bff&quot;,
        &quot;icons&quot;: [{
            &quot;src&quot;: &quot;https://cdn-icons-png.flaticon.com/512/0/191.png&quot;,
            &quot;sizes&quot;: &quot;512x512&quot;,
            &quot;type&quot;: &quot;image/png&quot;
        }]
    }">
    <meta name="theme-color" content="#007bff">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            padding: 15px;
            margin: 0;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 480px;
        }
        .banner {
            background-color: #fff8e1;
            border: 1px solid #ffe082;
            color: #8d6e63;
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            text-align: center;
            margin-bottom: 15px;
        }
        h2 { margin-top: 0; color: #333; text-align: center; font-size: 20px; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }
        .stat-box {
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
        }
        .box-baja { background-color: #e3f2fd; color: #1565c0; }
        .box-alta { background-color: #f3e5f5; color: #7b1fa2; }
        .box-oriental { background-color: #e8f5e9; color: #2e7d32; }
        
        input[type="password"], textarea, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            margin-top: 10px;
            font-size: 14px;
        }
        
        .cat-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .btn-baja { background-color: #007bff; }
        .btn-alta { background-color: #6f42c1; }
        .btn-oriental { background-color: #28a745; }
        
        .action-box {
            background-color: #f8f9fa;
            border: 2px dashed #007bff;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            text-align: center;
        }
        
        .btn-process {
            background-color: #25D366;
            color: white;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-cancel {
            background-color: #6c757d;
            color: white;
            width: 100%;
            padding: 8px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            margin-top: 6px;
        }
        .btn-admin-add { background-color: #28a745; color: white; width: 100%; padding: 10px; border: none; border-radius: 8px; margin-top: 8px; cursor: pointer; font-weight: bold; }
        .btn-admin-clear { background-color: #dc3545; color: white; width: 100%; padding: 10px; border: none; border-radius: 8px; margin-top: 8px; cursor: pointer; font-weight: bold; }
        
        .hidden { display: none; }
        .status {
            margin-top: 12px;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            font-size: 13px;
        }
        .status.success { background-color: #d4edda; color: #155724; }
        .status.error { background-color: #f8d7da; color: #721c24; }
        hr { border: 0; height: 1px; background: #e0e0e0; margin: 20px 0; }
    </style>
</head>
<body>

<div class="card">
    <div class="banner">
        📱 Para instalar como App: Abre el menú de tu navegador y selecciona "Agregar a la pantalla de inicio".
    </div>

    <h2>Gestor de Códigos ☁️</h2>

    <!-- Login -->
    <div id="login-screen">
        <p style="text-align: center; color: #666; font-size: 14px;">Ingresa tu clave de acceso:</p>
        <input type="password" id="access-key" placeholder="Contraseña">
        <button class="cat-btn btn-baja" onclick="login()">Ingresar</button>
        <div id="login-status" class="status hidden"></div>
    </div>

    <!-- Módulo Principal -->
    <div id="main-screen" class="hidden">
        <!-- Estadísticas -->
        <div class="stats-grid">
            <div class="stat-box box-baja">🌊 Occ. Baja<br><span id="cnt-baja" style="font-size:18px;">0</span></div>
            <div class="stat-box box-alta">⚡ Occ. Alta<br><span id="cnt-alta" style="font-size:18px;">0</span></div>
            <div class="stat-box box-oriental">👷 Oriental<br><span id="cnt-oriental" style="font-size:18px;">0</span></div>
        </div>

        <p style="text-align: center; font-size: 13px; color: #555; margin-bottom: 5px;">Selecciona la categoría a solicitar:</p>

        <!-- Botones de Categorías -->
        <button class="cat-btn btn-baja" onclick="reserveCode('Occ. Baja')">🌊 Pedir Occ. Baja</button>
        <button class="cat-btn btn-alta" onclick="reserveCode('Occ. Alta')">⚡ Pedir Occ. Alta</button>
        <button class="cat-btn btn-oriental" onclick="reserveCode('Oriental')">👷 Pedir Oriental</button>

        <!-- Área de Acción / Reserva -->
        <div id="action-box" class="action-box hidden">
            <div style="font-weight: bold; color: #333; font-size: 14px;">
                🔑 <span id="reserved-info">Código listo para entregar</span>
            </div>
            <button class="btn-process" onclick="processAndSend()">📱 Solicitar por WhatsApp y Telegram</button>
            <button class="btn-cancel" onclick="cancelReservation()">✖ Cancelar</button>
        </div>

        <div id="user-status" class="status hidden"></div>

        <!-- Panel Administrador -->
        <div id="admin-panel" class="hidden">
            <hr>
            <h3 style="text-align: center; color: #333; font-size: 16px; margin: 0 0 10px 0;">Panel de Administración</h3>
            
            <label style="font-size: 12px; color: #666;">Selecciona la categoría para cargar:</label>
            <select id="admin-category">
                <option value="alta">Occ. Alta</option>
                <option value="baja">Occ. Baja</option>
                <option value="oriental">Oriental</option>
            </select>

            <textarea id="bulk-codes" rows="4" placeholder="Pega los códigos aquí (uno por línea)..."></textarea>
            <button class="btn-admin-add" onclick="uploadCodes()">Cargar Códigos a Firebase</button>
            <button class="btn-admin-clear" onclick="clearCategoryCodes()">Borrar Códigos de esta Categoría</button>
            <div id="admin-status" class="status hidden"></div>
        </div>
    </div>
</div>

<script>
    // === CONFIGURACIÓN DE ACCESO Y CONTACTO ===
    const CLAVE_USUARIO = "1234";
    const CLAVE_ADMIN = "admin123";
    const NUMERO_WHATSAPP = "573015379493";
    
    // URL raíz de la Base de Datos Firebase Realtime
    const FIREBASE_BASE_URL = "https://base-de-datos-codigos-c1bb1-default-rtdb.firebaseio.com";
    
    // Telegram Bot
    const TELEGRAM_TOKEN = "8759498141:AAHXZVSk7yX6iHsLJodEuh66bLdKO0Us7v8";
    const TELEGRAM_CHAT_ID = "6449886096";

    let reservedItem = null;
    let currentCategory = "";
    let currentUserType = "Usuario 🔑";

    function getDeviceType() {
        const ua = navigator.userAgent;
        if (/android/i.test(ua)) return "Android 📱";
        if (/iPad|iPhone|iPod/i.test(ua)) return "iPhone 📱";
        return "PC 💻";
    }

    function getFormattedDateTime() {
        const d = new Date();
        const fecha = `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`;
        const hora = d.toLocaleTimeString('es-CO', { hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: true }).toLowerCase();
        return `${fecha}.  ${hora}`;
    }

    async function sendTelegramNotification(text) {
        try {
            await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: TELEGRAM_CHAT_ID,
                    text: text,
                    parse_mode: 'HTML'
                })
            });
        } catch(e) { 
            console.error("Error al enviar notificación a Telegram", e); 
        }
    }

    async function login() {
        const inputKey = document.getElementById('access-key').value.trim();
        const status = document.getElementById('login-status');
        const device = getDeviceType();
        const dateTime = getFormattedDateTime();

        if (inputKey === CLAVE_ADMIN) {
            currentUserType = "Administrador 🔑";
            document.getElementById('admin-panel').classList.remove('hidden');
            showMainScreen();
            
            const msg = `🚨 <b>NUEVO INGRESO A LA APP</b>\n\n` +
                        `👤 <b>Acceso:</b> ${currentUserType}\n` +
                        `💻 <b>Dispositivo:</b> ${device}\n` +
                        `📅 <b>Fecha y Hora:</b> ${dateTime}`;
            await sendTelegramNotification(msg);

        } else if (inputKey === CLAVE_USUARIO) {
            currentUserType = "Usuario 🔑";
            document.getElementById('admin-panel').classList.add('hidden');
            showMainScreen();

            const msg = `🚨 <b>NUEVO INGRESO A LA APP</b>\n\n` +
                        `👤 <b>Acceso:</b> ${currentUserType}\n` +
                        `💻 <b>Dispositivo:</b> ${device}\n` +
                        `📅 <b>Fecha y Hora:</b> ${dateTime}`;
            await sendTelegramNotification(msg);

        } else {
            showStatus(status, "Clave incorrecta", "error");
        }
    }

    function showMainScreen() {
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('main-screen').classList.remove('hidden');
        fetchAllData();
    }

    // Normalizar tipos para evitar confusiones de nombres ("alta", "Occ. Alta", "occ_alta")
    function matchCategory(tipoDB, targetCat) {
        if (!tipoDB) return false;
        const str = String(tipoDB).toLowerCase();
        const target = String(targetCat).toLowerCase();

        if (target.includes("alta")) return str.includes("alta");
        if (target.includes("baja")) return str.includes("baja");
        if (target.includes("oriental")) return str.includes("oriental");
        return false;
    }

    let allDatabaseItems = {};

    async function fetchAllData() {
        try {
            // Lee toda la base de datos de raíz
            let res = await fetch(`${FIREBASE_BASE_URL}/.json`);
            let data = await res.json();
            
            // Si los datos vienen dentro de un nodo '/codigos', lo extraemos
            if (data && data.codigos) {
                data = data.codigos;
            }

            allDatabaseItems = data || {};

            let cntBaja = 0;
            let cntAlta = 0;
            let cntOriental = 0;

            if (data && typeof data === 'object') {
                Object.keys(data).forEach(key => {
                    const item = data[key];
                    if (item && typeof item === 'object') {
                        // Un código está disponible si 'usado' es false o no existe
                        const isAvailable = (item.usado === false || item.usado === "false" || item.usado === undefined);
                        
                        if (isAvailable) {
                            if (matchCategory(item.tipo, "baja")) cntBaja++;
                            else if (matchCategory(item.tipo, "alta")) cntAlta++;
                            else if (matchCategory(item.tipo, "oriental")) cntOriental++;
                        }
                    }
                });
            }

            document.getElementById('cnt-baja').textContent = cntBaja;
            document.getElementById('cnt-alta').textContent = cntAlta;
            document.getElementById('cnt-oriental').textContent = cntOriental;

        } catch (e) {
            console.error("Error leyendo Firebase", e);
            document.getElementById('cnt-baja').textContent = "0";
            document.getElementById('cnt-alta').textContent = "0";
            document.getElementById('cnt-oriental').textContent = "0";
        }
    }

    async function reserveCode(category) {
        const status = document.getElementById('user-status');
        showStatus(status, "Obteniendo código disponible...", "success");

        await fetchAllData(); // Refrescar los datos actualizados

        let foundItem = null;
        let foundKey = null;

        Object.keys(allDatabaseItems).forEach(key => {
            const item = allDatabaseItems[key];
            if (item && typeof item === 'object') {
                const isAvailable = (item.usado === false || item.usado === "false" || item.usado === undefined);
                if (isAvailable && matchCategory(item.tipo, category)) {
                    if (!foundItem) {
                        foundItem = item;
                        foundKey = key;
                    }
                }
            }
        });

        if (!foundItem) {
            showStatus(status, `No hay códigos disponibles en ${category}.`, "error");
            return;
        }

        currentCategory = category;
        reservedItem = {
            key: foundKey,
            codigo: foundItem.texto || foundItem.codigo || foundItem.value || "S/N"
        };

        document.getElementById('reserved-info').textContent = `1 Código listo para [${category}]`;
        document.getElementById('action-box').classList.remove('hidden');
        showStatus(status, `Código listo. Presiona el botón verde para solicitar.`, "success");
    }

    async function cancelReservation() {
        if (reservedItem) {
            const dateTime = getFormattedDateTime();
            const msg = `🔄 <b>CÓDIGOS CANCELADOS / LIBERADOS</b>\n\n` +
                        `📌 <b>Categoría:</b> ${currentCategory}\n` +
                        `🔢 <b>Cantidad:</b> 1\n` +
                        `👤 <b>Acción por:</b> ${currentUserType}\n` +
                        `📅 <b>Fecha:</b> ${dateTime}`;
            await sendTelegramNotification(msg);
        }

        reservedItem = null;
        currentCategory = "";
        document.getElementById('action-box').classList.add('hidden');
        const status = document.getElementById('user-status');
        showStatus(status, "Reserva cancelada", "error");
    }

    async function processAndSend() {
        if (!reservedItem) return;

        const status = document.getElementById('user-status');
        showStatus(status, "Procesando código en la base de datos...", "success");

        const codeValue = reservedItem.codigo;
        const dbKey = reservedItem.key;

        // Actualiza el registro en Firebase marcando usado: true
        try {
            await fetch(`${FIREBASE_BASE_URL}/${dbKey}.json`, { 
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ usado: true })
            });
        } catch(e) {
            console.error("Error al actualizar en Firebase", e);
        }

        // 1. Notificación enviada a Telegram
        const dateTime = getFormattedDateTime();
        const telegramMsg = `📲 <b>SOLICITUD DE CÓDIGO</b>\n\n` +
                            `📌 <b>Categoría:</b> ${currentCategory}\n` +
                            `🔑 <b>Código:</b> <code>${codeValue}</code>\n` +
                            `👤 <b>Pedido por:</b> ${currentUserType}\n` +
                            `📅 <b>Fecha y Hora:</b> ${dateTime}`;
        await sendTelegramNotification(telegramMsg);

        // 2. Formato para enviar por WhatsApp
        const waMsgText = `Hola, solicito el código para *${currentCategory}*:\n\n*Código:* ${codeValue}`;
        const waUrl = `https://wa.me/${NUMERO_WHATSAPP}?text=${encodeURIComponent(waMsgText)}`;
        window.open(waUrl, '_blank');

        showStatus(status, "¡Código procesado y enviado con éxito!", "success");
        document.getElementById('action-box').classList.add('hidden');
        reservedItem = null;
        fetchAllData();
    }

    async function uploadCodes() {
        const cat = document.getElementById('admin-category').value; // 'alta', 'baja', 'oriental'
        const text = document.getElementById('bulk-codes').value.trim();
        const status = document.getElementById('admin-status');

        if (!text) {
            showStatus(status, "Ingresa al menos un código", "error");
            return;
        }

        const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);

        for (const code of lines) {
            await fetch(`${FIREBASE_BASE_URL}/.json`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    texto: code,
                    tipo: cat,
                    usado: false
                })
            });
        }

        document.getElementById('bulk-codes').value = '';
        showStatus(status, `Se cargaron ${lines.length} código(s) exitosamente.`, "success");
        fetchAllData();
    }

    async function clearCategoryCodes() {
        const cat = document.getElementById('admin-category').value;
        if (!confirm(`¿Seguro que deseas eliminar los códigos de ${cat}?`)) return;

        const status = document.getElementById('admin-status');
        await fetchAllData();

        Object.keys(allDatabaseItems).forEach(async (key) => {
            const item = allDatabaseItems[key];
            if (item && matchCategory(item.tipo, cat)) {
                await fetch(`${FIREBASE_BASE_URL}/${key}.json`, { method: 'DELETE' });
            }
        });

        showStatus(status, `Limpieza completada en ${cat}`, "error");
        setTimeout(fetchAllData, 1000);
    }

    function showStatus(element, msg, type) {
        element.textContent = msg;
        element.className = `status ${type}`;
        element.classList.remove('hidden');
    }

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('data:text/javascript,console.log("PWA SW activo")');
    }
</script>
</body>
</html>
